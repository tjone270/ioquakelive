name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev \
          libfreetype-dev libogg-dev libvorbis-dev libopusfile-dev
    - name: Compile
      run: make release -j$(nproc)
      env:
        ARCHIVE: 1
    - uses: actions/upload-artifact@v4
      with:
        name: linux-x86_64
        path: build/*.zip

  macos:
    name: macOS
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: brew install sdl2 curl freetype libogg libvorbis opus opusfile
    - name: Compile
      run: make release -j$(sysctl -n hw.logicalcpu)
      env:
        ARCHIVE: 1
    - uses: actions/upload-artifact@v4
      with:
        name: macos-arm64
        path: build/*.zip

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install VS 2025 Build Tools (v145)
      shell: powershell
      run: |
        choco install visualstudio2025buildtools --package-parameters `
          "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64" -y

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build libcurl
      shell: bash
      run: |
        cd code/curl
        cmake -B build -A x64 -DBUILD_SHARED_LIBS=OFF \
          -DCURL_USE_SCHANNEL=ON -DBUILD_CURL_EXE=OFF \
          -DBUILD_TESTING=OFF -DCURL_USE_LIBSSH2=OFF -DHTTP_ONLY=ON
        cmake --build build --config Release
        mkdir -p ../libs/win64
        cp build/lib/Release/libcurl_a.lib ../libs/win64/

    - name: Build Solution
      run: msbuild misc/msvc142/ioquakelive.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /m

    - name: Collect artifacts
      shell: bash
      run: |
        mkdir -p release
        find build/ -name "*.exe" -exec cp {} release/ \; 2>/dev/null || true
        find build/ -name "*.dll" -exec cp {} release/ \; 2>/dev/null || true
        cp code/libs/win64/SDL2.dll release/ 2>/dev/null || true

    - uses: actions/upload-artifact@v4
      with:
        name: windows-x64
        path: release/

  windows-mingw:
    name: Windows (MinGW)
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Compile
      run: |
        choco install zip
        make release -j $env:NUMBER_OF_PROCESSORS
      env:
        ARCHIVE: 1
    - uses: actions/upload-artifact@v4
      with:
        name: windows-x64-mingw
        path: build/*.zip

  release:
    name: Create Release
    needs: [linux, macos, windows-msvc, windows-mingw]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/**/*
        generate_release_notes: true
