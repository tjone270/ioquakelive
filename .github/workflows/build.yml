name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev \
          libfreetype-dev libogg-dev libvorbis-dev
    - name: Compile
      run: make release -j$(nproc)
    - name: Stage build outputs
      run: |
        mkdir -p staging/dlls staging/engine
        cp build/release-linux-x86_64/baseq3/cgamex86_64.so      staging/dlls/
        cp build/release-linux-x86_64/baseq3/qagamex86_64.so     staging/dlls/
        cp build/release-linux-x86_64/baseq3/uix86_64.so         staging/dlls/
        cp build/release-linux-x86_64/quakelive.x86_64           staging/engine/
        cp build/release-linux-x86_64/quakelive_dedicated.x86_64 staging/engine/
        cp build/release-linux-x86_64/opengl2x86_64.so           staging/engine/
    - uses: actions/upload-artifact@v4
      with:
        name: dlls-linux-x86_64
        path: staging/dlls/
    - uses: actions/upload-artifact@v4
      with:
        name: engine-linux-x86_64
        path: staging/engine/

  macos:
    name: macOS
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: brew install sdl2 freetype libogg libvorbis
    - name: Compile
      run: make release USE_LOCAL_HEADERS=0 ARCH=arm64 -j$(sysctl -n hw.logicalcpu)
    - name: Create App Bundle
      run: |
        chmod +x make-macosx-app.sh
        ./make-macosx-app.sh release arm64
    - name: Stage build outputs
      run: |
        mkdir -p staging/dlls staging/engine
        cp build/release-darwin-arm64/baseq3/cgamearm64.dylib  staging/dlls/
        cp build/release-darwin-arm64/baseq3/qagamearm64.dylib staging/dlls/
        cp build/release-darwin-arm64/baseq3/uiarm64.dylib     staging/dlls/
        # The engine artifact is the entire .app bundle
        cp -R build/release-darwin-arm64/quakelive.app staging/engine/quakelive.app
    - uses: actions/upload-artifact@v4
      with:
        name: dlls-macos-arm64
        path: staging/dlls/
    - uses: actions/upload-artifact@v4
      with:
        name: engine-macos-arm64
        path: staging/engine/

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install VS 2026 Build Tools (v145)
      shell: pwsh
      run: |
        Write-Host "Installing VS 2026 Build Tools..."
        choco install visualstudio2026buildtools `
          --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended --quiet" `
          -y --ignore-package-exit-codes=3010
        Write-Host "VS 2026 Build Tools installation completed"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild misc/msvc/ioquakelive.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /m

    - name: Stage build outputs
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path staging/dlls   | Out-Null
        New-Item -ItemType Directory -Force -Path staging/engine | Out-Null
        Copy-Item build/Release/x64/baseq3/cgamex86_64.dll  staging/dlls/
        Copy-Item build/Release/x64/baseq3/qagamex86_64.dll staging/dlls/
        Copy-Item build/Release/x64/baseq3/uix86_64.dll     staging/dlls/
        # Engine binaries plus the runtime DLLs (SDL2, freetype, ...) that
        # ship next to quakelive.exe
        Copy-Item build/Release/x64/*.exe staging/engine/
        Copy-Item build/Release/x64/*.dll staging/engine/
    - uses: actions/upload-artifact@v4
      with:
        name: dlls-windows-x64
        path: staging/dlls/
    - uses: actions/upload-artifact@v4
      with:
        name: engine-windows-x64
        path: staging/engine/

  package:
    name: Package release artifacts
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Download DLL artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: dlls-*
        path: dlls
        merge-multiple: true
    - name: Download engine artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: engine-*
        path: engines
    - name: Build universal iobin.pk3
      run: |
        python code/tools/make_deterministic_pk3.py \
          --input dlls \
          --output shared/baseq3/iobin.pk3
        sha256sum shared/baseq3/iobin.pk3
    - name: Build deterministic pak01.pk3
      run: |
        python code/tools/make_deterministic_pk3.py \
          --input content/pak01 \
          --output shared/baseq3/pak01.pk3
        sha256sum shared/baseq3/pak01.pk3
    - name: Build per-platform release zips
      run: |
        python code/tools/build_release_zips.py \
          --shared shared \
          --engines engines \
          --output build
        ls -la build/
    - uses: actions/upload-artifact@v4
      with:
        name: release-zips
        path: build/quakelive-*.zip

  release:
    name: Create Release
    needs: [package]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from commit message
      id: version
      run: |
        MSG="${{ github.event.head_commit.message }}"
        VERSION=$(echo "$MSG" | head -1 | sed 's/^release: *//')
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
    - name: Create tag
      run: |
        git tag "${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"
    - uses: actions/download-artifact@v4
      with:
        name: release-zips
        path: artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.version }}
        files: artifacts/*.zip
        generate_release_notes: true
